server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 6m;

    # ^~ gives these prefix matches priority over the regex asset-caching
    # rule below (nginx otherwise always prefers a regex location, which
    # broke poster/gallery images: they live under /uploads/ and end in
    # .jpg, so without ^~ the caching regex intercepted them before this
    # proxy_pass ever ran and served a bogus 404 from the static root).
    location ^~ /api/ {
        proxy_pass http://api:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    }

    location ^~ /uploads/ {
        proxy_pass http://api:8000/uploads/;
        proxy_set_header Host $host;
    }

    # Hashed build assets (JS/CSS/fonts) never change content under the same
    # filename -- safe to cache aggressively.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html MUST always be revalidated: Telegram's in-app WebView caches
    # it very aggressively, so without this header users keep loading a stale
    # build (old JS bundle) even after we redeploy and they reopen the mini app.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
